[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-too-long — handled by formatter where it matters
    "B008",  # function calls in default args (fine for FastAPI / pytest patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # module-level DB patching in test_database.py is intentional

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true  # playwright ships partial or no stubs
files = ["config", "scraper", "tracker", "main.py"]

[tool.coverage.run]
omit = [".venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
# Floor, not a target: the Playwright/network scraper paths can't be unit-tested
# without live services, so the absolute number is low. This is a ratchet to stop
# the testable logic from regressing.
fail_under = 40
