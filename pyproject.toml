[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-too-long — handled by formatter where it matters
    "B008",  # function calls in default args (fine for FastAPI / pytest patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # module-level DB patching in test_database.py is intentional

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true  # playwright / telegram / pytz ship partial or no stubs
files = ["config", "scraper", "applicant", "prompts", "telegram_bot", "tracker", "main.py"]

[[tool.mypy.overrides]]
# python-telegram-bot exposes Update/CallbackQuery attributes (effective_chat,
# message, MaybeInaccessibleMessage.chat_id, ...) as Optional. They are non-None
# inside our authorized handlers but can't be statically narrowed without a guard
# on every handler. Relax just these two noise codes here; the rest of the
# codebase stays fully type-checked. TODO(Phase 3): add handler guards and drop this.
module = "telegram_bot.bot"
disable_error_code = ["union-attr", "attr-defined"]

[tool.coverage.run]
omit = [".venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
# Floor, not a target: the Playwright/network/LLM I/O paths (scrapers, apply
# engine, generator) can't be unit-tested without live services, so the absolute
# number is low. This is a ratchet to stop the testable logic from regressing.
fail_under = 40
