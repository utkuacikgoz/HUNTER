name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + dev deps from the lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-cov==7.1.0 \
            ruff==0.15.20 mypy==2.1.0 pip-audit==2.10.0 types-pytz==2026.2.0.20260518

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Dependency audit (CVEs)
        run: pip-audit -r requirements.lock

      - name: Test
        run: pytest -q --cov=. --cov-report=term-missing
