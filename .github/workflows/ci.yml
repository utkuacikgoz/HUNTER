name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + dev deps from the lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # Dev tools come from requirements-dev.txt, not a second copy of the pins here:
          # duplicating them meant a bump could land in the file while CI silently kept
          # testing the old versions. Runtime still comes from the lock (exact transitives).
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Dependency audit (CVEs)
        run: pip-audit -r requirements.lock

      - name: Test
        run: pytest -q --cov=. --cov-report=term-missing
