name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + dev deps from the lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest==8.3.4 pytest-asyncio==0.25.0 pytest-cov==6.0.0 \
            ruff==0.8.4 mypy==1.13.0 types-pytz==2024.2.0.20241003

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q --cov=. --cov-report=term-missing
