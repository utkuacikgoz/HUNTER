name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + dev deps from the lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest==8.3.4 pytest-asyncio==0.25.0 ruff==0.8.4

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
