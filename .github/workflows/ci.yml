name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify requirements.lock is in sync with requirements.txt
        # Dependabot bumps requirements.txt but not the lock (which CI/prod install
        # from), so a direct-pin bump can silently drift. Fail fast — stdlib only.
        run: python scripts/check_lock_sync.py

      - name: Install runtime + dev deps from the lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # Dev tools come from requirements-dev.txt, not a second copy of the pins here:
          # duplicating them meant a bump could land in the file while CI silently kept
          # testing the old versions. Runtime still comes from the lock (exact transitives).
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Security lint (bandit)
        # Medium+ severity only; the LOW noise (asserts, try/except/pass) and the
        # three reviewed false positives are annotated with `# nosec` in-source.
        run: bandit -q -r . -ll -x ./tests,./.venv

      - name: Dependency audit (CVEs)
        run: pip-audit -r requirements.lock

      - name: Test
        run: pytest -q --cov=. --cov-report=term-missing

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan (repo + history)
        run: gitleaks detect --redact --exit-code 1
