# fly.toml — HUNTER job-hunting bot.
#
# This app is a single long-running worker (Telegram long-poll bot + APScheduler
# cron). It has NO HTTP server, so there is no [http_service] / ports section.
# State is SQLite on a persistent volume, so it must run as exactly ONE machine
# that never auto-stops — do not scale it past 1.
#
# ── Environment-variable architecture ───────────────────────────────────────
# SECRETS (credentials + PII) → `fly secrets set`, encrypted, NEVER in this file:
#
#   fly secrets set \
#     TELEGRAM_BOT_TOKEN=... \
#     TELEGRAM_CHAT_ID=... \
#     ANTHROPIC_API_KEY=sk-ant-... \
#     RESUME_TEXT="$(cat config/resume.txt)" \
#     APPLICANT_NAME="..." APPLICANT_FIRST_NAME="..." APPLICANT_LAST_NAME="..." \
#     APPLICANT_EMAIL="..." APPLICANT_PHONE="..." \
#     APPLICANT_LINKEDIN="..." APPLICANT_WEBSITE="..."
#     # optional: LINKEDIN_SESSION_COOKIE=...
#
# NON-SECRET CONFIG → the [env] block below (committed). Anything not set here
# falls back to the defaults in config/settings.py. See .env.example for the
# full list of overridable keys.
# ────────────────────────────────────────────────────────────────────────────
app = "hunter-whjqdw"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Run two supervised bots on this one machine (CMD is `bot-all`): the default
  # PM bot ("" = no profile) plus the "hakan" marketing profile. The hakan child
  # loads its secrets/PII from /data/.env.hakan and /data/resume.hakan.txt
  # (uploaded out-of-band to the volume, never in the image). Set to "" or drop
  # this key to run only the default bot.
  HUNTER_PROFILES = ",hakan"
  # Point the DB at the mounted volume so it survives deploys/restarts.
  DB_PATH = "/data/hunter.db"
  # Résumé PDF lives on the persistent volume (uploaded out-of-band, off git).
  RESUME_PATH = "/data/resume.pdf"
  LOG_LEVEL = "INFO"
  CLAUDE_MODEL = "claude-sonnet-4-6"
  COVER_LETTER_MODEL = "claude-opus-4-8"
  # Let Claude resolve "unknown sponsor" jobs into include/drop (small API cost
  # per uncertain job; ANTHROPIC_API_KEY must be set as a secret).
  ENABLE_LLM_SPONSOR_SCORING = "true"
  # Live: Greenhouse/Lever applications are submitted for real (résumé is on the
  # volume). Each job is still human-approved in Telegram first. Set "true" to
  # pause real submits (dry-run / screenshot only).
  APPLY_DRY_RUN = "false"
  # Add any other non-secret overrides here, e.g.:
  #   MAX_JOBS_PER_DAY = "50"

# Persistent volume for the SQLite database.
[[mounts]]
  source = "hunter_data"
  destination = "/data"

# Playwright/Chromium is memory-hungry; 1GB is the practical floor.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
